<!-- collaborators_map.html - Renders an interactive map of collaborators using Leaflet and data from _data/collaborators.yml -->
<div class="post">
  <header class="post-header">
    <h2 class="post-title">Collaborators</h2>
    <p class="desc">Locations of selected collaborators and research partners</p>
  </header>

  <article>
    <div id="collab-map" class="collab-map"></div>
  </article>
</div>

<!-- Leaflet CSS/JS loaded from CDN so this include is self-contained -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-sA+4ZbM4x1qN5y7v8p2w5u4rM+0k2d+fDqk5Q0fA9kM=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-o9N1j8m3f1eI3mQb3q3q6s2Qe8k4VvGk8m5b0w3a9kA=" crossorigin=""></script>

<script>
// Initialize map after the page loads
document.addEventListener("DOMContentLoaded", function () {
  try {
    var mapEl = document.getElementById('collab-map');
    if (!mapEl) return;

    // Center on Europe by default (adjust as needed)
    var map = L.map('collab-map', { scrollWheelZoom: false }).setView([51.0, 1.0], 4);

    // OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // Collaborator data injected by Jekyll
    var collaborators = [];
    try {
      collaborators = {{ site.data.collaborators | jsonify }};
    } catch (e) {
      // fallback: if Jekyll didn't render, keep empty
      collaborators = [];
    }

    var bounds = [];

    collaborators.forEach(function (c) {
      if (!c.lat || !c.lon) return;
      var popup = '<strong>' + (c.name || '') + '</strong>';
      if (c.affiliation) popup += '<br/>' + c.affiliation;
      if (c.city) popup += '<br/>' + c.city;
      if (c.url) popup += '<br/><a href="' + c.url + '" target="_blank" rel="noopener">Website</a>';

      var marker = L.marker([c.lat, c.lon]).addTo(map).bindPopup(popup);
      bounds.push([c.lat, c.lon]);
    });

    if (bounds.length === 1) {
      map.setView(bounds[0], 8);
    } else if (bounds.length > 1) {
      map.fitBounds(bounds, { padding: [40, 40] });
    }
  } catch (err) {
    console.error('Collaborators map error:', err);
  }
});
</script>
